# Publishes the frontend to GitHub Pages as a static preview with sample content
# (no backend: the admin panel does not work). Enable once: Settings > Pages > Source: GitHub Actions.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build
        working-directory: frontend
        run: |
          bun run build-only
          # Pages answers unknown paths (e.g. /about on refresh) with 404.html; serve the SPA there.
          cp dist/index.html dist/404.html
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_DEMO: '1' # sample content from src/lib/demo-content.json instead of the API
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
